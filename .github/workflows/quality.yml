name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: chron-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test agent skill and evidence policies
        run: npm run test:agent-skills --workspace @chron/web

      - name: Test authentication configuration
        run: npm run test:auth-config --workspace @chron/web

      - name: Test calendar time semantics
        run: npm run test:calendar-time --workspace @chron/web

      - name: Test calendar API contracts
        run: npm run test:calendar-api --workspace @chron/web

      - name: Test PostgreSQL calendar tenant isolation
        run: npm run test:calendar-postgres --workspace @chron/web
        env:
          CHRON_TEST_DATABASE_URL: postgresql://postgres:chron-ci-test-only@127.0.0.1:5432/postgres
          CHRON_TEST_REQUIRED: "1"

      - name: Test calendar layout
        run: npm run test:calendar-layout --workspace @chron/web

      - name: Test calendar create recovery
        run: npm run test:calendar-recovery --workspace @chron/web

      - name: Test HTTPS reminder scheduler
        run: npm run test:reminder-scheduler --workspace @chron/web

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build
